<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stackly — 404</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Extra 404-specific styles */
    .error-content { animation: fadeInUp 0.6s var(--ease-out) both; }
    .error-number  { animation: fadeInUp 0.5s var(--ease-out) both; }

    .scan-line {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(245,158,11,0.6), transparent);
      animation: scanDown 4s linear infinite;
    }

    @keyframes scanDown {
      0%   { top: 0; }
      100% { top: 100%; }
    }

    .error-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(245,158,11,0.1);
      animation: ringPulse 3s ease-in-out infinite;
    }

    .ring-1 { width: 300px; height: 300px; top:50%; left:50%; transform:translate(-50%,-50%); }
    .ring-2 { width: 500px; height: 500px; top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:.5s; }
    .ring-3 { width: 700px; height: 700px; top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:1s; }

    @keyframes ringPulse {
      0%, 100% { opacity: 0.3; transform: translate(-50%,-50%) scale(1); }
      50% { opacity: 0.08; transform: translate(-50%,-50%) scale(1.05); }
    }

    .error-subtitle a {
      color: var(--amber-300);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>

<div class="blob-container">
  <div class="blob blob-1" style="opacity:.1"></div>
  <div class="blob blob-2" style="opacity:.1"></div>
</div>
<div class="noise-overlay"></div>

<div class="page-404">
  <div class="scan-line"></div>

  <!-- Rings -->
  <div class="error-ring ring-1"></div>
  <div class="error-ring ring-2"></div>
  <div class="error-ring ring-3"></div>

  <!-- Floating Items -->
  <div class="floating-items">
    <div class="float-item">📚</div>
    <div class="float-item">📖</div>
    <div class="float-item">📝</div>
    <div class="float-item">✏️</div>
    <div class="float-item">🔬</div>
    <div class="float-item">📐</div>
    <div class="float-item">🧪</div>
    <div class="float-item">🗒️</div>
  </div>

  <!-- Graduation Cap -->
  <div class="grad-cap">🎓</div>

  <!-- Main Content -->
  <div class="error-content">
    <div class="error-number">404</div>
    <h2 class="error-title">Password Recovery Service Not Available</h2>
    <p class="error-subtitle">
      Oops! This page is on a study break. The password recovery feature isn't available yet.<br />
      Head back and use your credentials to sign in.
    </p>
    <button class="btn-back" onclick="history.back()">
      ← Back 
    </button>
  </div>
</div>

</body>
</html>
